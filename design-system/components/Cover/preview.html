<!-- @dsCard height=320 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coral Studio</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface-page); color:var(--text-primary); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:320px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:320px; overflow:hidden; }
  .art svg { display:block; width:480px; height:320px; }
  .coral { fill:var(--coral-fill); }
  .ink { fill:var(--text-primary); }
  .cool { fill:var(--cool-complement); }
  .card { rx:var(--radius-card); }
  .btn { rx:var(--radius-button); }
  .pill.wave { fill:var(--coral-fill); }
  .pill.cut { fill:var(--on-coral); }
  .pill.loose { fill:var(--coral-accent); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:112px; line-height:.95; font-weight:800; letter-spacing:-.02em; color:var(--text-primary); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; font-weight:600; color:var(--text-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 320" width="480" height="320">
<!--
  blocks      coral-fill 168x280 slab bled off the top (the shirt coral, biggest) · text-primary 152x176 (cream in Studio, ink in Daylight) · cool-complement 104x64 bled off the right (the small technical accent) — about 30% of 960x320
  arrangement one tall coral slab with two satellites, bottoms stepping down, space-2 gutters
  pattern     three-bar audio waveform from the studio graphic language ("short audio bars", Speaking/microphone): space-1-wide pills at a space-2 pitch — coral on the cream block, cut into the slab in on-coral, a loose run in coral-accent above the teal
  scales      sides in space-1 multiples; gutters space-2; pitch space-2; corners radius-card (slab, block), radius-button (teal), pills rx 4 = half of space-1
-->
<rect class="coral card" x="24" y="-16" width="168" height="280" rx="16"/>
<rect class="ink card" x="208" y="120" width="152" height="176" rx="16"/>
<rect class="cool btn" x="376" y="232" width="120" height="64" rx="12"/>
<rect class="pill wave" x="224" y="248" width="8" height="24" rx="4"/>
<rect class="pill wave" x="240" y="216" width="8" height="56" rx="4"/>
<rect class="pill wave" x="256" y="184" width="8" height="88" rx="4"/>
<rect class="pill wave" x="272" y="232" width="8" height="40" rx="4"/>
<rect class="pill wave" x="288" y="200" width="8" height="72" rx="4"/>
<rect class="pill wave" x="304" y="168" width="8" height="104" rx="4"/>
<rect class="pill wave" x="320" y="224" width="8" height="48" rx="4"/>
<rect class="pill wave" x="336" y="240" width="8" height="32" rx="4"/>
<rect class="pill cut" x="48" y="224" width="8" height="16" rx="4"/>
<rect class="pill cut" x="64" y="208" width="8" height="32" rx="4"/>
<rect class="pill cut" x="80" y="216" width="8" height="24" rx="4"/>
<rect class="pill cut" x="96" y="192" width="8" height="48" rx="4"/>
<rect class="pill cut" x="112" y="224" width="8" height="16" rx="4"/>
<rect class="pill cut" x="128" y="200" width="8" height="40" rx="4"/>
<rect class="pill cut" x="144" y="216" width="8" height="24" rx="4"/>
<rect class="pill loose" x="384" y="200" width="8" height="16" rx="4"/>
<rect class="pill loose" x="400" y="176" width="8" height="40" rx="4"/>
<rect class="pill loose" x="416" y="192" width="8" height="24" rx="4"/>
<rect class="pill loose" x="432" y="160" width="8" height="56" rx="4"/>
<rect class="pill loose" x="448" y="184" width="8" height="32" rx="4"/>
<rect class="pill loose" x="464" y="200" width="8" height="16" rx="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">Coral<br>Studio</h1>
<p class="tag">A warm creator studio to watch, learn, and invite Ajay to speak.</p>
</div>
</div>
</body>
</html>
